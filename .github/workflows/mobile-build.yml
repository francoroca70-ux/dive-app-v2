name: Mobile app builds (Android + iOS)

# Builds the Capacitor-wrapped native apps in the cloud, so no local Android Studio
# or Mac/Xcode is ever needed. Uses GitHub's own free build runners (macOS included)
# with the GitHub account/repo Fran already has — no new signups for this step.
#
# Run it any time from the Actions tab ("Run workflow"), or it runs automatically
# whenever android/, ios/, index.html, or the Capacitor config changes on main.
#
# What this produces right now:
#   - Android: an installable debug .apk (sideload it on a phone to test), plus
#     a signed release .aab ready to upload to Play Console -- ONLY once the
#     four ANDROID_KEYSTORE_BASE64 / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS /
#     RELEASE_KEY_PASSWORD secrets are added under Settings -> Secrets and
#     variables -> Actions. Until those exist, the release-signing step is
#     skipped automatically and only the debug APK is produced (nothing breaks).
#   - iOS: an unsigned build for the iPhone Simulator (proves the app compiles;
#     an actual installable/testable iPhone build needs an Apple Developer account
#     and signing certificates, which isn't set up yet — see App-Store-Roadmap.md)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'

jobs:
  build-android:
    runs-on: ubuntu-latest
    # GitHub Actions doesn't allow the `secrets` context inside a step's `if:`
    # condition directly (that caused runs #16/#17 to fail with "Invalid workflow
    # file" / 0 jobs run) -- the standard workaround is to copy the secret into a
    # job-level env var first, then check that env var in `if:` instead.
    env:
      RELEASE_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build www/ from the live web app
        run: npm run build:www

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: seven-seas-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Play Console requires a signed .aab, not a debug .apk, for every track
      # including closed testing. This step only runs once the four secrets
      # below exist in the repo -- so it's a no-op (and doesn't fail the build)
      # until Fran adds them.
      - name: Decode release keystore
        id: keystore
        if: ${{ env.RELEASE_KEYSTORE_B64 != '' }}
        working-directory: android/app
        run: |
          echo "Encoded secret length: ${#RELEASE_KEYSTORE_B64} chars (expect ~3816 -- if this is way off, the GitHub secret paste was incomplete)"
          echo "$RELEASE_KEYSTORE_B64" | base64 -d --ignore-garbage > release-upload-key.jks
          echo "Decoded keystore file size:"
          ls -l release-upload-key.jks
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release AAB
        if: steps.keystore.outputs.has_keystore == 'true'
        working-directory: android
        env:
          # Relative to android/app/build.gradle's own project dir (android/app/),
          # not to this step's working-directory (android/) -- the keystore was
          # decoded to android/app/release-upload-key.jks, so from build.gradle's
          # point of view that's just "release-upload-key.jks", no "app/" prefix.
          RELEASE_STORE_FILE: release-upload-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.has_keystore == 'true'
        with:
          name: seven-seas-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

  build-ios:
    runs-on: macos-latest
    # Automatic signing (CODE_SIGN_STYLE=Automatic + -allowProvisioningUpdates) never
    # managed to bootstrap a Distribution certificate/profile from scratch on this CI
    # runner -- every attempt failed asking for a Development-type profile instead,
    # regardless of identity overrides, team ID settings, or API key permissions. So
    # this job uses MANUAL signing instead: a Distribution certificate + App Store
    # provisioning profile were created once by hand (via the Apple Developer web
    # portal + openssl, no Mac required) and stored as base64 secrets below. The
    # App Store Connect API key is still used, but only to authenticate the final
    # TestFlight upload -- not for provisioning.
    # Same job-level env workaround as build-android above (secrets can't be read
    # directly inside a step's `if:`).
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
      APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      IOS_CERT_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build www/ from the live web app
        run: npm run build:www

      - name: Sync Capacitor (iOS)
        run: npx cap sync ios

      # This project uses Swift Package Manager (CapApp-SPM), not CocoaPods — there's no
      # Podfile, so a `pod install` step here would just fail. Xcode resolves the Swift
      # packages automatically as part of the build below.

      - name: Build for iOS Simulator (unsigned fallback — used until all the
          signing secrets below exist)
        if: env.APPSTORE_KEY_ID == '' || env.APPSTORE_ISSUER_ID == '' || env.APPSTORE_PRIVATE_KEY == '' || env.IOS_CERT_BASE64 == '' || env.IOS_CERT_PASSWORD == '' || env.IOS_PROFILE_BASE64 == ''
        working-directory: ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Install App Store Connect API key (used for TestFlight upload only)
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          mkdir -p ~/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

      - name: Install signing certificate into a temporary keychain
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          # Use `printf` (not `echo`, which can mangle backslashes/flags on some
          # shells) and `openssl base64 -d -A` (not the platform `base64` tool,
          # whose decode behavior differs between macOS/BSD and Linux/GNU) so
          # decoding is identical regardless of runner OS.
          printf '%s' "$IOS_CERT_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/distribution.p12"
          echo "Decoded cert size: $(wc -c < "$RUNNER_TEMP/distribution.p12") bytes (sha256: $(shasum -a 256 "$RUNNER_TEMP/distribution.p12" | cut -d' ' -f1))"
          security import "$RUNNER_TEMP/distribution.p12" -k build.keychain -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)

      - name: Install provisioning profile
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          printf '%s' "$IOS_PROFILE_BASE64" | openssl base64 -d -A -out ~/Library/MobileDevice/Provisioning\ Profiles/SevenSeasOps.mobileprovision
          echo "Decoded profile size: $(wc -c < ~/Library/MobileDevice/Provisioning\ Profiles/SevenSeasOps.mobileprovision) bytes"

      - name: Archive signed build for TestFlight
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        working-directory: ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=c6f019bf-de75-48a0-b9a9-09d23af53da0 \
            DEVELOPMENT_TEAM=7Y8G4Y5Y67

      - name: Export .ipa
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        working-directory: ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/"*.ipa \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - uses: actions/upload-artifact@v4
        if: env.APPSTORE_KEY_ID != '' && env.APPSTORE_ISSUER_ID != '' && env.APPSTORE_PRIVATE_KEY != '' && env.IOS_CERT_BASE64 != '' && env.IOS_CERT_PASSWORD != '' && env.IOS_PROFILE_BASE64 != ''
        with:
          name: seven-seas-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
